name: CI

on:
  push:
    branches:
      - "custom/main"
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Only validate and build the Windows candidate"
        type: boolean
        default: false

jobs:
  rust:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo build
        working-directory: src-tauri
        run: cargo build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  frontend:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - name: Rust tests including native Windows execution regressions
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installable NSIS candidate without publishing a release
        run: npm run tauri -- build --bundles nsis
      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
